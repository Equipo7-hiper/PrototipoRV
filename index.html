<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Se importan las librerías: A-Frame y AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar.js"></script>
    <link rel="manifest" href="manifest.json">
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</head>
<body style="margin: 0; overflow: hidden;">

    <!-- Se inicia la escena de realidad aumentada -->
    <a-scene embedded arjs>

        <!-- Se define el marcador que la cámara va a buscar -->
        <a-marker type="pattern" url="pattern-Mancha.patt">
            <!-- El cubo 3D aparecerá flotando sobre el marcador -->
            <a-box position="0 0.5 0" material="color: red;"></a-box>
        </a-marker>

        <!-- La cámara del celular renderiza el entorno -->
        <a-entity camera></a-entity>

    </a-scene>

</body>
</html>
